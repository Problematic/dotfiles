# Kept deliberately in step with ~/.config/alacritty/alacritty.toml so the two
# terminals look and behave the same; change both together.

include catppuccin-mocha.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0

window_padding_width 8
background_opacity   0.95
background_blur      24
scrollback_lines     50000

# Alacritty sends ESC CR for shift+enter (its [[keyboard.bindings]] entry);
# mirrored here so multi-line prompts behave identically in both.
map shift+enter send_text all \x1b\r

confirm_os_window_close 0
