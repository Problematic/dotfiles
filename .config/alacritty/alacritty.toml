[general]
import = ["~/.config/alacritty/themes/catppuccin-mocha.toml"]

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
padding = { x = 8, y = 8 }
opacity = 0.95
blur = true

[scrolling]
history = 50000

# --- pre-existing config below, preserved verbatim ---
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
